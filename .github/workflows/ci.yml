name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.12 / Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ci-test-placeholder
      LOG_LEVEL: WARNING
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        shell: bash
        run: |
          # Avoid invoking setup.py's editable install: it re-reads the full
          # requirements file and redundantly resolves every dependency.
          grep -vE '^-e \.?$' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install --prefer-binary -r "$RUNNER_TEMP/requirements-ci.txt"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Compile application modules
        run: python -m compileall -q agent.py main.py toolkit data_models utils knowledge_base.py

      - name: Run test suite
        env:
          CHECKPOINT_DB_PATH: ${{ runner.temp }}/clinic-ci-conversations.sqlite3
        run: python -m pytest -q -p no:cacheprovider
