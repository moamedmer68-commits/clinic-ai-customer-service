name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.12 / Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ci-test-placeholder
      API_ACCESS_TOKEN: ci-test-api-token
      LOG_LEVEL: WARNING
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-test.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pinned runtime and test dependencies
        run: python -m pip install --prefer-binary -r requirements-test.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Compile application modules
        run: python -m compileall -q agent.py main.py streamlit_ui.py ui_helpers.py toolkit data_models utils knowledge_base.py support

      - name: Run test suite
        env:
          CHECKPOINT_DB_PATH: ${{ runner.temp }}/clinic-ci-conversations.sqlite3
          HANDOFF_DB_PATH: ${{ runner.temp }}/clinic-ci-handoffs.sqlite3
        run: python -m pytest -q -p no:cacheprovider

      - name: Build production container
        run: docker build --pull -t clinic-ai-customer-service:${{ github.sha }} .
