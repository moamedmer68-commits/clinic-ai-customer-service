name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.11 / Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ci-test-placeholder
      LOG_LEVEL: WARNING
      CHECKPOINT_DB_PATH: ${{ runner.temp }}/clinic-ci-conversations.sqlite3
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Compile application modules
        run: python -m compileall -q agent.py main.py toolkit data_models utils knowledge_base.py

      - name: Run test suite
        run: python -m pytest -q -p no:cacheprovider
